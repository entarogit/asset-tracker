<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbfbfd">
    <meta name="color-scheme" content="light">
    <meta name="description" content="한국·미국 주식과 원화·달러 예수금을 한곳에서 관리하는 실시간 포트폴리오 트래커입니다.">
    <title>자산 트래킹 · 로그인</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="login-container">
        <article class="login-card">
            <div class="login-header">
                <span class="login-logo" aria-hidden="true">📊</span>
                <h1>자산 트래킹</h1>
                <p class="login-subtitle">나만의 포트폴리오를 관리하세요</p>
            </div>

            <div class="login-features">
                <div class="feature-item">
                    <span class="feature-icon" aria-hidden="true">📈</span>
                    <span>한국 &amp; 미국 주식 실시간 추적</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon" aria-hidden="true">💱</span>
                    <span>실시간 환율 반영</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon" aria-hidden="true">🔒</span>
                    <span>개인별 독립 포트폴리오</span>
                </div>
            </div>

            <a href="/auth/login" class="google-login-btn">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Google로 로그인
            </a>

            <p class="login-notice">
                로그인하면 개인 포트폴리오가 자동으로 생성됩니다.<br>
                모든 데이터는 계정에 안전하게 저장됩니다.
            </p>
        </article>
    </main>
</body>
</html>
