<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산 트래킹 - 포트폴리오 관리</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <div>
                    <h1>📊 자산 트래킹</h1>
                    <p class="subtitle">실시간 포트폴리오 관리</p>
                </div>
                <div class="user-info" id="user-info">
                    <img class="user-avatar" id="user-avatar" src="" alt="프로필" style="display:none;">
                    <div class="user-details">
                        <span class="user-name" id="user-name">불러오는 중...</span>
                        <span class="user-email" id="user-email"></span>
                    </div>
                    <a href="/auth/logout" class="btn btn-logout" style="border-radius:50px;">로그아웃</a>
                </div>
            </div>
        </header>

        <!-- 자산 요약 섹션 -->
        <section class="asset-summary">
            <div class="summary-cards">
                <div class="summary-card">
                    <h3>총 자산</h3>
                    <p class="amount" id="total-asset">₩0</p>
                </div>
                <div class="summary-card">
                    <h3>주식 평가액</h3>
                    <p class="amount" id="stock-value">₩0</p>
                </div>
                <div class="summary-card">
                    <h3>예수금</h3>
                    <p class="amount" id="cash-amount">₩0</p>
                </div>
                <div class="summary-card">
                    <h3>총 손익</h3>
                    <p class="amount profit-loss" id="total-profit-loss">₩0</p>
                </div>
            </div>

            <!-- 환율 정보 표시 -->
            <div class="exchange-rate-info">
                <span class="exchange-label">💱 USD/KRW 실시간 환율:</span>
                <span class="exchange-value" id="exchange-rate">₩1,320</span>
                <span class="exchange-status" id="exchange-status"></span>
            </div>
        </section>

        <!-- 예수금 입력 섹션 -->
        <section class="cash-section">
            <h2>💰 예수금 관리</h2>
            <div class="cash-input-group">
                <input type="number" id="cash-input" placeholder="예수금 입력 (원)" min="0" step="1000">
                <button onclick="updateCash()" class="btn btn-primary">예수금 업데이트</button>
            </div>
        </section>

        <!-- 주식 추가 섹션 -->
        <section class="add-stock-section">
            <h2>➕ 주식 추가</h2>
            <div class="add-stock-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="stock-market">시장 선택</label>
                        <select id="stock-market">
                            <option value="kr">🇰🇷 한국 주식</option>
                            <option value="us">🇺🇸 미국 주식</option>
                        </select>
                    </div>
                    <div class="form-group autocomplete-wrapper">
                        <label for="stock-symbol">종목명/티커</label>
                        <input type="text" id="stock-symbol" placeholder="예: 삼성전자, AAPL" autocomplete="off">
                        <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="stock-quantity">수량</label>
                        <input type="number" id="stock-quantity" placeholder="보유 주식 수" min="1" step="1">
                    </div>
                    <div class="form-group">
                        <label for="stock-avg-price">평단가</label>
                        <input type="number" id="stock-avg-price" placeholder="매입 평균 단가" min="0" step="0.01">
                    </div>
                </div>
                <button onclick="addStock()" class="btn btn-success">주식 추가</button>
            </div>
        </section>

        <!-- 포트폴리오 섹션 -->
        <section class="portfolio-section">
            <h2>📈 보유 주식 현황</h2>
            <div class="portfolio-actions">
                <button onclick="refreshPortfolio()" class="btn btn-secondary">🔄 새로고침</button>
            </div>
            <div class="portfolio-grid" id="portfolio-grid">
                <div class="loading">포트폴리오를 불러오는 중...</div>
            </div>
        </section>
    </div>

    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p>데이터를 처리하는 중...</p>
    </div>

    <!-- 알림 메시지 -->
    <div class="notification" id="notification"></div>

    <script src="/static/script.js"></script>
</body>
</html>
